name: CI

# Re-runs the R analysis on every push / PR and fails if the computed group
# summary no longer matches the committed snapshot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: Rscript -e 'install.packages("readxl")'

      - name: Run analysis and check against snapshot
        run: Rscript R/analyze_qpcr.R

      - name: Upload generated tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-results
          path: results/generated/*.csv
          if-no-files-found: warn
